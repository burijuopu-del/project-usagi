<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#050706">

  <title>Project Bunny</title>

  <style>
    :root {
      --background: #030504;
      --panel: rgba(4, 9, 7, 0.92);
      --green: #77ff9c;
      --green-soft: #35d869;
      --green-dark: #143d22;
      --white: #d9ffe3;
      --muted: #73927b;
      --danger: #ff6470;
      --warning: #ffd166;
      --shadow: 0 0 18px rgba(75, 255, 124, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--background);
      color: var(--green);
      font-family:
        "Courier New",
        Courier,
        monospace;
    }

    body {
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .hidden {
      display: none !important;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(
          circle at center,
          rgba(24, 73, 38, 0.18),
          transparent 62%
        ),
        #020403;
    }

    #app::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      opacity: 0.24;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.025) 0,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px,
          transparent 4px
        );
    }

    #app::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 21;
      pointer-events: none;
      box-shadow:
        inset 0 0 120px rgba(0, 0, 0, 0.95),
        inset 0 0 25px rgba(0, 0, 0, 0.9);
    }

    .screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #boot-screen {
      z-index: 5;
      padding:
        max(20px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
      overflow-y: auto;
      background: #000;
    }

    #boot-output {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: clamp(11px, 1.7vw, 15px);
      line-height: 1.45;
      text-shadow: 0 0 6px rgba(82, 255, 130, 0.35);
    }

    #skip-button {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 30;
      padding: 9px 13px;
      border: 1px solid rgba(104, 255, 146, 0.4);
      border-radius: 4px;
      background: rgba(4, 10, 7, 0.84);
      color: var(--muted);
      cursor: pointer;
      transition: 180ms ease;
    }

    #skip-button:hover,
    #skip-button:focus-visible {
      color: var(--green);
      border-color: var(--green);
      box-shadow: var(--shadow);
      outline: none;
    }

    #terminal-screen {
      z-index: 4;
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(
          180deg,
          rgba(8, 17, 11, 0.95),
          rgba(1, 5, 3, 0.98)
        );
    }

    .terminal-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 8px 14px;
      border-bottom: 1px solid rgba(82, 255, 130, 0.16);
      background: rgba(9, 15, 11, 0.92);
      user-select: none;
    }

    .window-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      opacity: 0.8;
    }

    .window-dot.red {
      background: #ff5f56;
    }

    .window-dot.yellow {
      background: #ffbd2e;
    }

    .window-dot.green {
      background: #27c93f;
    }

    .terminal-title {
      margin-left: 7px;
      color: #a7b7ab;
      font-size: 12px;
    }

    #terminal-output {
      flex: 1 1 auto;
      margin: 0;
      padding: 18px 18px 10px;
      overflow-y: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: clamp(12px, 1.8vw, 15px);
      line-height: 1.55;
      scrollbar-color: var(--green-dark) transparent;
    }

    .terminal-line {
      min-height: 1.4em;
    }

    .system-line {
      color: var(--muted);
    }

    .success-line {
      color: var(--green);
    }

    .warning-line {
      color: var(--warning);
    }

    .error-line {
      color: var(--danger);
    }

    .story-line {
      color: var(--white);
      text-shadow: 0 0 9px rgba(143, 255, 172, 0.28);
    }

    .input-area {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding:

        max(18px, env(safe-area-inset-right))
        max(14px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));

      background: rgba(2, 8, 4, 0.96);
    }

    #prompt {
      flex: 0 0 auto;
      color: var(--green-soft);
      white-space: nowrap;
    }

    #command-input {
      flex: 1 1 auto;
      width: 100%;
      padding: 4px 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--white);
      caret-color: var(--green);
      text-shadow: 0 0 5px rgba(82, 255, 130, 0.35);
    }

    #command-input:disabled {
      opacity: 0.5;
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(0, 3, 1, 0.9);
      backdrop-filter: blur(3px);
    }

    .overlay-card {
      width: min(700px, 100%);
      max-height: 85dvh;
      overflow-y: auto;
      padding: clamp(20px, 5vw, 42px);
      border: 1px solid rgba(113, 255, 154, 0.36);
      border-radius: 7px;
      background:
        linear-gradient(
          145deg,
          rgba(8, 21, 13, 0.98),
          rgba(2, 8, 4, 0.99)

        inset 0 0 35px rgba(65, 255, 115, 0.03);
      text-align: center;

      margin: 0 0 20px;
      color: var(--white);
      font-size: clamp(22px, 6vw, 42px);
      letter-spacing: 0.08em;
    }

    .overlay-card p {
      color: #a9c8b0;
      line-height: 1.7;
    }

    .overlay-card button {
      margin-top: 20px;

      border: 1px solid var(--green);
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      transition: 180ms ease;

    .overlay-card button:focus-visible {
      background: rgba(83, 255, 132, 0.1);
      box-shadow: 0 0 25px rgba(83, 255, 132, 0.2);
      outline: none;
    }

    .glitch {
      animation: glitch 260ms steps(2, end) 3;
    }

    .shake {
      animation: shake 300ms linear;
    }

    @keyframes glitch {
      0% {
        transform: translate(0);
        filter: none;
      }

      20% {
        transform: translate(-3px, 2px);
        filter: hue-rotate(50deg);
      }

      40% {
        transform: translate(4px, -1px);
      }

      60% {
        transform: translate(-2px, -2px);
        filter: contrast(1.6);
      }

      80% {
        transform: translate(3px, 1px);
      }

      100% {
        transform: translate(0);
        filter: none;
      }
    }

    @keyframes shake {
      0%,
      100% {
        transform: translate(0);
      }

      25% {
        transform: translate(-3px, 1px);
      }

      50% {
        transform: translate(3px, -1px);
      }

      75% {
        transform: translate(-2px, -1px);
      }
    }

    @media (max-width: 650px) {
      .terminal-header {
        min-height: 38px;
      }

      #terminal-output {
        padding: 14px 12px 8px;
      }

      .input-area {

        padding-left: 12px;
        padding-right: 12px;
      }

      #prompt {
        font-size: 11px;
      }

      #command-input {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

    function sleep(milliseconds) {
      return new Promise((resolve) => {
        window.setTimeout(resolve, milliseconds);
      });
    }

    function normalizePath(path) {
      if (!path) {
        return state.currentDirectory;
      }

      let resolvedPath = path;

      if (!path.startsWith("/")) {
        resolvedPath =
          state.currentDirectory === "/"
            ? `/${path}`
            : `${state.currentDirectory}/${path}`;
      }

      const parts = resolvedPath.split("/");
      const normalizedParts = [];

      for (const part of parts) {
        if (!part || part === ".") {
          continue;
        }

        if (part === "..") {
          normalizedParts.pop();
          continue;
        }

        normalizedParts.push(part);
      }

      return `/${normalizedParts.join("/")}`;
    }

    function getNode(path) {
      return fileSystem[normalizePath(path)] || null;
    }

    function hasAccess(node) {
      const requiredAccess = Number(node?.access || 0);
      return state.accessLevel >= requiredAccess;
    }

        function saveState() {
      try {
        const saveData = {
          stage: state.stage,
          currentDirectory: state.currentDirectory,
          accessLevel: state.accessLevel,
          solved: state.solved
        };

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(saveData)
        );
      } catch (error) {
        console.warn("Sauvegarde indisponible :", error);
      }
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (!saved) {
          return;
        }

        const data = JSON.parse(saved);

        if (Number.isFinite(data.stage)) {
          state.stage = data.stage;
        }

        if (
          typeof data.currentDirectory === "string" &&
          fileSystem[data.currentDirectory]
        ) {
          state.currentDirectory = data.currentDirectory;
        }

        if (Number.isFinite(data.accessLevel)) {
          state.accessLevel = data.accessLevel;
        }

        if (data.solved && typeof data.solved === "object") {
          state.solved = {
            ...state.solved,
            ...data.solved
          };
        }
      } catch (error) {
        console.warn("Sauvegarde corrompue ignorée :", error);
      }
    }

    function resetState() {
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (error) {
        console.warn(error);
      }

      window.location.reload();
    }

    function getPromptPath() {
      if (state.currentDirectory === "/home/guest") {

    function scrollTerminalToBottom() {
      terminalOutput.scrollTop = terminalOutput.scrollHeight;

    function printLine(text = "", className = "") {
      const line = document.createElement("div");
      line.className = `terminal-line ${className}`.trim();
      line.textContent = text;
      terminalOutput.appendChild(line);
      scrollTerminalToBottom();
      return line;
    }

    function printBlock(text, className = "") {
      const lines = String(text).split("\n");

      for (const line of lines) {
        printLine(line, className);
      }
    }

    async function typeBootText(text, speed) {
      for (const character of text) {
        if (state.bootCompleted) {
          return;
        }

        bootOutput.textContent += character;
        bootScreen.scrollTop = bootScreen.scrollHeight;

        if (character !== " " && character !== "\n") {
          await sleep(speed);
        }
      }

    function listDirectory(path, showHidden = false) {
      const targetPath = normalizePath(path);
      const node = fileSystem[targetPath];

      if (!node) {
        printLine(
          `ls: impossible d'accéder à '${path}': Aucun fichier ou dossier`,
          "error-line"
        );
        return;
      }

      if (!requireAccess(node)) {
        return;
      }

      if (node.type !== "directory") {
        printLine(targetPath.split("/").pop());
        return;
      }

      const children = node.children || [];

      const visibleChildren = children.filter((child) => {
        return showHidden || !child.startsWith(".");
      });

      if (visibleChildren.length === 0) {
        printLine("");
        return;
      }

      for (const child of visibleChildren) {
        const childPath =
          targetPath === "/"
            ? `/${child}`
            : `${targetPath}/${child}`;

        const childNode = fileSystem[childPath];
        const suffix =
          childNode?.type === "directory"
            ? "/"
            : "";

        const accessMarker =
          childNode?.access &&
          state.accessLevel < childNode.access
            ? " [LOCKED]"
            : "";

        printLine(
          `${child}${suffix}${accessMarker}`,
          childNode?.type === "directory"
            ? "success-line"
            : ""
        );
      }
    }

    function printTree(path = state.currentDirectory, prefix = "") {
      const targetPath = normalizePath(path);
      const node = fileSystem[targetPath];

      if (!node) {
        printLine(
          `tree: '${path}' introuvable`,
          "error-line"
        );
        return;
      }

      if (!requireAccess(node)) {
        return;
      }

      printLine(
        targetPath,
        node.type === "directory"
          ? "success-line"
          : ""
      );

      if (node.type !== "directory") {
        return;
      }

      const children = node.children || [];

      children.forEach((child, index) => {
        const isLast = index === children.length - 1;

        const childPath =
          targetPath === "/"
            ? `/${child}`
            : `${targetPath}/${child}`;

        const childNode = fileSystem[childPath];

        const connector = isLast ? "└── " : "├── ";
        const locked =
          childNode?.access &&
          state.accessLevel < childNode.access
            ? " [LOCKED]"
            : "";

        printLine(
          `${prefix}${connector}${child}${childNode?.type === "directory" ? "/" : ""}${locked}`
        );
      });
    }

    async function executeCommand(rawCommand) {
      const command = rawCommand.trim();

      if (!command) {
        return;
      }

      state.commandHistory.push(command);
      state.historyIndex = state.commandHistory.length;

      printLine(
        `${promptElement.textContent} ${command}`,
        "success-line"
      );

      const parts = command.match(/(?:[^\s"]+|"[^"]*")+/g) || [];
      const baseCommand = (parts.shift() || "").toLowerCase();

      const args = parts.map((item) => {
        return item.replace(/^"(.*)"$/, "$1");
      });

      switch (baseCommand) {
        case "help":
          showHelp();
          break;

        case "ls": {
          const showHidden = args.includes("-la") || args.includes("-a");
          const pathArgument = args.find((arg) => !arg.startsWith("-"));
          listDirectory(pathArgument || state.currentDirectory, showHidden);
          break;
        }

        case "cd":
          changeDirectory(args[0] || "/home/guest");
          break;

        case "pwd":
          printLine(state.currentDirectory);
          break;

        case "cat":
          if (!args[0]) {
            printLine(
              "cat: opérande manquant",
              "error-line"
            );
          } else {
            readFile(args.join(" "));
          }
          break;

        case "tree":
          printTree(args[0] || state.currentDirectory);
          break;

        case "whoami":
          if (state.accessLevel < 2) {
            printLine("guest");
          } else if (state.accessLevel < 4) {
            printLine("authorized_visitor");
          } else {
            printLine("someone_she_was_meant_to_find");
          }
          break;

        case "scan":
          await scanSystem(args.join(" "));
          break;

        case "decrypt":
          await decryptFile(args.join(" "));
          break;

        case "answer":
          answerPuzzle(args.join(" "));
          break;

        case "dance":
          if ((args[0] || "").toLowerCase() === "rain") {
            executeRainProtocol();
          } else {
            printLine(
              "Usage : dance rain",
              "error-line"
            );
          }
          break;

        case "unlock":
          if ((args[0] || "").toLowerCase() === "october") {
            unlockOctober();
          } else {
            printLine(
              "Usage : unlock october",
              "error-line"
            );
          }
          break;

        case "date":
          validateDate(args.join(" "));
          break;

        case "status":
          showStatus();
          break;

        case "resume":
        case "objectif":
          showResume();
          break;

        case "history":
          state.commandHistory.forEach((item, index) => {
            printLine(`${index + 1}  ${item}`);
          });
          break;

        case "clear":
          terminalOutput.innerHTML = "";
          break;

        case "run":
        case "bash":
        case "sh":
          await runDestination(args.join(" "));
          break;

        case "love":
          if (state.accessLevel < 4) {
            printLine(
              "love: command not found",
              "error-line"
            );
          } else {
            printLine(
              "Command found.",
              "success-line"
            );

            printLine(
              "Some processes were never errors.",
              "story-line"
            );
          }
          break;

        case "sudo":
          printLine(
            "guest is not in the sudoers file. This incident will be reported.",
            "error-line"
          );
          break;

        case "ip":
          if ((args[0] || "") === "a") {
            printBlock(
`1: lo: <LOOPBACK,UP>
    inet 127.0.0.1/8

2: bunny0: <BROADCAST,MULTICAST,UP>
    inet 10.1.10.1/24
    state CONNECTED
    alias memory-tunnel`
            );
          } else {
            printLine(
              "Usage simulé : ip a",
              "error-line"
            );
          }
          break;

        case "hostnamectl":
          printBlock(
` Static hostname: project-bunny
       Icon name: computer-vm
         Chassis: vm
      Machine ID: BUNNY-CHAN-1001
Operating System: Project Bunny Linux
          Kernel: Linux 6.8.0-bunny-amd64
    Architecture: x86-64`
          );
          break;

        case "journalctl":
          readFile("/project_bunny/logs/system.log");
          break;

        case "reset":
          resetState();
          break;

        default:
          printLine(
            `${baseCommand}: command not found`,
            "error-line"
          );
      }

      printLine("");
    }

    commandInput.addEventListener("keydown", (event) => {
      if (event.key === "ArrowUp") {
        event.preventDefault();

        if (state.commandHistory.length === 0) {
          return;
        }

        state.historyIndex = Math.max(
          0,
          state.historyIndex - 1
        );

        commandInput.value =
          state.commandHistory[state.historyIndex] || "";

        window.setTimeout(() => {
          commandInput.setSelectionRange(
            commandInput.value.length,
            commandInput.value.length
          );
        }, 0);
      }

      if (event.key === "ArrowDown") {
        event.preventDefault();

        if (state.commandHistory.length === 0) {
          return;
        }

        state.historyIndex = Math.min(
          state.commandHistory.length,
          state.historyIndex + 1
        );

        commandInput.value =
          state.commandHistory[state.historyIndex] || "";
      }

      if (event.key === "Tab") {
        event.preventDefault();

        const value = commandInput.value.trim();

        const suggestions = [
          "help",
          "ls -la",
          "cat README.txt",
          "scan identity",
          "status",
          "resume",
          "tree /project_bunny"
        ];

        const match = suggestions.find((item) => {
          return item.startsWith(value);
        });

        if (match) {
          commandInput.value = match;
        }
      }
    });

    skipButton.addEventListener("click", () => {
      openTerminal();
    });

    terminalScreen.addEventListener("click", () => {
      commandInput.focus();
    });

    overlayButton.addEventListener("click", () => {
      if (overlayButton.dataset.action === "redirect") {
        window.location.href = FINAL_SITE_URL;
        return;
      }

      hideOverlay();
    });

    window.addEventListener("error", (event) => {
      console.error("Project Bunny error :", event.error);

      if (!terminalScreen.classList.contains("hidden")) {
        printLine(
          `[SYSTEM ERROR] ${event.message}`,
          "error-line"
        );
      }
    });

    function initializeProject() {
      loadState();
      runBootSequence();
    }

    initializeProject();
  </script>
</body>
</html>
